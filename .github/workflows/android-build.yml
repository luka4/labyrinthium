# Android APK built on a GitHub runner with `eas build --local`:
# same build as EAS cloud, but with no 45-minute limit and no build credits.
# Run it from Actions → "Android build" → Run workflow; the APK is attached to the run as an artifact.
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens):
# the build fetches the Android keystore stored in EAS credentials.

name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview]
        default: development

concurrency:
  group: android-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages (match the EAS image)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: eas build --local (${{ inputs.profile }})
        run: |
          mkdir -p build
          eas build --local --non-interactive --platform android \
            --profile "${{ inputs.profile }}" \
            --output "build/labyrinthium-${{ inputs.profile }}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: labyrinthium-${{ inputs.profile }}-apk
          path: build/*.apk
          retention-days: 14
